  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace" font-size="18" fill="rgba(255,255,255,0.78)">
    <text x="118" y="330">Projects " Writeups " Labs</text>
    <text x="118" y="368">AppSec " Linux " Networking</text>
  </g>

  <g>
    <rect x="118" y="410" width="210" height="46" rx="14" fill="#3b82f6"/>
